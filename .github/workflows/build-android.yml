
name: Build Masahaq Scanner APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Masahaq-Scanner-Project.zip'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project
        run: |
          unzip Masahaq-Scanner-Project.zip -d project
          cd project/Masahaq-Scanner
          npm install
          npm run build
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd project/Masahaq-Scanner/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Masahaq-Scanner-APK
          path: project/Masahaq-Scanner/android/app/build/outputs/apk/debug/app-debug.apk
